<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate a movie</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: 'Gill Sans';
        }
    </style>
</head>
<body>
    <h1>Rate a movie</h1>
    <img src="images.jpeg" alt="Movie Image">
    <form>
        <label for="moivetitle">Title of the movie</label>
        <Input type="text" Id="movie" name="movie" placeholder="write the title">
        <br>
        <label for="genre"><b>Genre of the movie</b></lab   l>
        <Input type="checkbox" id="action" name="action" value="action">
    <label for="action">Action</label>
    <Input type="checkbox" id="horror" name="horror" value="horror">
    <label for="action">Horror</label>
    <Input type="checkbox" id="Romance" name="Romance" value="Romace">
    <label for="Romance">Romance</label>
    <Input type="checkbox" id="Comedy" name="Comedy" value="Comedy">
    <label for="Comedy">Comedy</label>
    <br>
    <label for="rating">Rating</label>
    <Input type="radio" id="rating1" name="rating" value="*">
    <label for="rating1">1 star</label>
    <Input type="radio" id="rating2" name="rating" value="**">
    <label for="rating2">2 stars</label>
    <Input type="radio" id="rating3" name="rating" value="***">
    <label for="rating3">3 stars</label>
    <Input type="radio" id="rating4" name="rating" value="****">
    <label for="rating4">4 stars</label>
    <Input type="radio" id="rating5" name="rating" value="*****">
    <label for="rating5">5 stars</label>
    <br>
    <label for="review">Review of the movie</label>
    <textarea id="review" name="review" rows="4" cols="50" placeholder="Kindly share your thoughts about the movie"></textarea>
    <br>
    <Input type="submit" value="submit"
</form>
</body>
</html>
